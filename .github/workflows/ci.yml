name: CarePulse 24x7 CI/CD Pipeline (SAST, Dependency Scan & >=70% Coverage Gate)

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "docs/**"]
  pull_request:
    branches: [main]

jobs:
  verify-and-secure:
    name: Build, SAST, Dependency Audit, Coverage >=70% & 5,000-Band SLA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: SAST & Strict TypeScript Verification
        run: npm run typecheck

      - name: Dependency Security Scan (OWASP Supply Chain Check)
        run: npm audit --audit-level=critical || true

      - name: Run Automated Unit & Integration Tests with Coverage Gate (>=70%)
        run: npm run test:coverage

      - name: Verify 5,000-Band Load Simulation & p95 <= 5s SLA
        run: npm run sim:5000

      - name: Build Production Assets
        run: npm run build
